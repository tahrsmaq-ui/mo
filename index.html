<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موكا كافيه — القائمة</title>
    <!-- خط تجوال -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #120e0c;
            --card-bg: #1d1714;
            --accent-gold: #d4af37;
            --text-main: #f5f5f5;
            --text-muted: #a09891;
            --border-color: #2e2621;
            --radius: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 140px;
        }

        header {
            text-align: center;
            padding: 20px 16px 10px;
            background: linear-gradient(180deg, rgba(29,23,20,0.9) 0%, rgba(18,14,12,0) 100%);
        }

        header h1 {
            color: var(--accent-gold);
            font-size: 1.6rem;
            margin-bottom: 4px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* شريط البحث */
        .search-box {
            position: relative;
            margin: 10px 0 16px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 40px 10px 14px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--accent-gold);
        }

        .search-box i {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-gold);
        }

        /* شبكة كروت المنتجات */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .menu-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            transition: transform 0.2s;
        }

        .menu-card:active {
            transform: scale(0.97);
        }

        .item-img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 8px;
            background-color: #2a221d;
        }

        .item-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .item-price {
            color: var(--accent-gold);
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }

        .add-btn {
            background-color: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            width: 100%;
            padding: 6px 0;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .add-btn:active {
            background-color: var(--accent-gold);
            color: #000;
        }

        /* السلة العائمة فوق الشريط */
        .cart-bar {
            position: fixed;
            bottom: 75px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 568px;
            background-color: var(--accent-gold);
            color: #000;
            padding: 12px 18px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.7);
            cursor: pointer;
            z-index: 99;
            font-weight: 700;
        }

        .cart-count {
            background-color: #000;
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            margin-right: 6px;
        }

        /* شريط التنقل السفلي المثبّت */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #17120f;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 0;
            z-index: 100;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.75rem;
            cursor: pointer;
            text-decoration: none;
            transition: color 0.2s;
            flex: 1;
        }

        .nav-item i {
            font-size: 1.2rem;
            margin-bottom: 3px;
        }

        .nav-item.active {
            color: var(--accent-gold);
            font-weight: 700;
        }

        /* Modal السلة */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 600px;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            max-height: 80vh;
            overflow-y: auto;
            border-top: 2px solid var(--accent-gold);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .cart-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .qty-btn {
            background: var(--border-color);
            color: var(--text-main);
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .send-whatsapp-btn {
            width: 100%;
            background-color: #25d366;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 700;
            margin-top: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <header>
        <h1>موكا كافيه</h1>
        <p>لحظات حلوة على ذوقك ☕</p>
    </header>

    <div class="container">
        <!-- شريط البحث -->
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="ابحث بالاسم..." oninput="filterMenu()">
        </div>

        <!-- شبكة المنتجات -->
        <div class="menu-grid" id="menuGrid"></div>
    </div>

    <!-- السلة العائمة -->
    <div class="cart-bar" id="cartBar" onclick="openCartModal()" style="display: none;">
        <div>
            <span class="cart-count" id="cartCount">0</span>
            <span>عرض الطلب</span>
        </div>
        <span id="cartTotal">0 ل.س</span>
    </div>

    <!-- شريط التنقل السفلي التطبيقي -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="filterCategory('الحلويات', this)">
            <i class="fa-solid fa-cookie-bite"></i>
            <span>الحلويات</span>
        </div>
        <div class="nav-item" onclick="filterCategory('إركيلة', this)">
            <i class="fa-solid fa-smog"></i>
            <span>إركيلة</span>
        </div>
        <div class="nav-item" onclick="filterCategory('موهيتو', this)">
            <i class="fa-solid fa-glass-water"></i>
            <span>موهيتو</span>
        </div>
        <div class="nav-item" onclick="filterCategory('قهوة باردة', this)">
            <i class="fa-solid fa-mug-saucer"></i>
            <span>قهوة باردة</span>
        </div>
    </nav>

    <!-- النافذة المنبثقة للسلة -->
    <div class="modal-overlay" id="cartModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>طلباتك المختارة</h3>
                <button class="close-btn" onclick="closeCartModal()">&times;</button>
            </div>
            <div id="cartItemsContainer"></div>
            <div style="margin-top: 16px; text-align: left; font-size: 1.1rem; font-weight: 700;">
                الإجمالي: <span id="modalTotal" style="color: var(--accent-gold);">0 ل.س</span>
            </div>
            <button class="send-whatsapp-btn" onclick="sendOrderToWhatsApp()">
                <i class="fa-brands fa-whatsapp"></i> إرسال الطلب عبر واتساب
            </button>
        </div>
    </div>

    <script>
        // مصفوفة العناصر مع الصور الفعلية والمشابهة بدقة عالية
        const menuData = [
            { 
                id: 1, 
                name: "وافل شوكلا", 
                category: "الحلويات", 
                price: 300, 
                img: "https://www.mochacafesy.com/storage/products/1723145450_66b668ea5b112.jpeg" 
            },
            { 
                id: 2, 
                name: "ستيك وافل", 
                category: "الحلويات", 
                price: 240, 
                img: "https://www.mochacafesy.com/storage/products/1723145532_66b6693c10321.jpeg" 
            },
            { 
                id: 3, 
                name: "وافل فواكه", 
                category: "الحلويات", 
                price: 450, 
                img: "https://images.unsplash.com/photo-1562376552-0d160a2f238d?auto=format&fit=crop&w=400&q=80" 
            },
            { 
                id: 4, 
                name: "كريب شوكلا", 
                category: "الحلويات", 
                price: 300, 
                img: "https://images.unsplash.com/photo-1519676867240-f03562e64548?auto=format&fit=crop&w=400&q=80" 
            },
            { 
                id: 5, 
                name: "إركيلة تفاحتين", 
                category: "إركيلة", 
                price: 250, 
                img: "https://images.unsplash.com/photo-1527016021513-b09758b777bd?auto=format&fit=crop&w=400&q=80" 
            },
            { 
                id: 6, 
                name: "موهيتو بلو", 
                category: "موهيتو", 
                price: 200, 
                img: "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=400&q=80" 
            },
            { 
                id: 7, 
                name: "سبانيش لاتيه", 
                category: "قهوة باردة", 
                price: 220, 
                img: "https://images.unsplash.com/photo-1517701604599-bb29b565090c?auto=format&fit=crop&w=400&q=80" 
            }
        ];

        let cart = {};
        let currentCategory = 'الحلويات';

        function renderMenu(items) {
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = '';

            if (items.length === 0) {
                grid.innerHTML = `<p style="grid-column: span 2; text-align: center; color: var(--text-muted); padding: 30px 0;">لا توجد أصناف مطابقة</p>`;
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'menu-card';
                card.innerHTML = `
                    <img src="${item.img}" alt="${item.name}" class="item-img" onerror="this.src='https://via.placeholder.com/200/2a221d/d4af37?text=${encodeURIComponent(item.name)}'">
                    <div class="item-title">${item.name}</div>
                    <div class="item-price">${item.price} ل.س</div>
                    <button class="add-btn" onclick="addToCart(${item.id})">
                        <i class="fa-solid fa-plus"></i> إضافة
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(cat, el) {
            currentCategory = cat;
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            if(el) el.classList.add('active');
            filterMenu();
        }

        function filterMenu() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = menuData.filter(item => {
                const matchesCat = item.category === currentCategory;
                const matchesSearch = item.name.toLowerCase().includes(query);
                return matchesCat && matchesSearch;
            });
            renderMenu(filtered);
        }

        function addToCart(itemId) {
            const item = menuData.find(i => i.id === itemId);
            if (cart[itemId]) {
                cart[itemId].qty++;
            } else {
                cart[itemId] = { ...item, qty: 1 };
            }
            updateCartUI();
        }

        function changeQty(itemId, delta) {
            if (cart[itemId]) {
                cart[itemId].qty += delta;
                if (cart[itemId].qty <= 0) delete cart[itemId];
            }
            updateCartUI();
            renderCartModalItems();
        }

        function updateCartUI() {
            let totalCount = 0;
            let totalPrice = 0;

            Object.values(cart).forEach(item => {
                totalCount += item.qty;
                totalPrice += item.price * item.qty;
            });

            const cartBar = document.getElementById('cartBar');
            if (totalCount > 0) {
                cartBar.style.display = 'flex';
                document.getElementById('cartCount').innerText = totalCount;
                document.getElementById('cartTotal').innerText = totalPrice + ' ل.س';
                document.getElementById('modalTotal').innerText = totalPrice + ' ل.س';
            } else {
                cartBar.style.display = 'none';
                closeCartModal();
            }
        }

        function openCartModal() {
            renderCartModalItems();
            document.getElementById('cartModal').style.display = 'flex';
        }

        function closeCartModal() {
            document.getElementById('cartModal').style.display = 'none';
        }

        function renderCartModalItems() {
            const container = document.getElementById('cartItemsContainer');
            container.innerHTML = '';

            Object.values(cart).forEach(item => {
                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `
                    <div>
                        <div style="font-weight: 700;">${item.name}</div>
                        <div style="color: var(--text-muted); font-size: 0.85rem;">${item.price * item.qty} ل.س</div>
                    </div>
                    <div class="cart-controls">
                        <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
                        <span>${item.qty}</span>
                        <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function sendOrderToWhatsApp() {
            const phone = "963900000000";
            let text = "مرحباً موكا كافيه، أود تقديم الطلب التالي:\n\n";
            let total = 0;

            Object.values(cart).forEach(item => {
                const subtotal = item.price * item.qty;
                total += subtotal;
                text += `• ${item.name} (عدد ${item.qty}) - ${subtotal} ل.س\n`;
            });

            text += `\n*الإجمالي:* ${total} ل.س`;

            const url = `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }

        // تشغيل القسم الأول افتراضياً
        filterMenu();
    </script>
</body>
</html>
